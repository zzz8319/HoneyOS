name: Deploy React UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ui
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Security scan — no secrets in dist
        run: |
          set -e
          patterns=(service_role SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET JWT_SECRET "BEGIN PRIVATE KEY")
          for pat in "${patterns[@]}"; do
            if grep -r "$pat" dist/ --include='*.js' --include='*.html' -l 2>/dev/null | grep -q .; then
              echo "FAIL: found '$pat' in dist/" >&2
              exit 1
            fi
          done
          echo "Security scan passed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-ui/dist

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
